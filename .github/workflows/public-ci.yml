name: public-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/public_export.py verify --require-public-tree

  runtime-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S recomp-runtime -B build/recomp-runtime
      - run: cmake --build build/recomp-runtime --config Debug
      - run: ctest --test-dir build/recomp-runtime -C Debug --output-on-failure

  runtime-tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install sdl3 ninja shaderc spirv-cross
      - run: swiftc -typecheck tools/launcher_macos.swift
      - run: cmake -S recomp-runtime -B build/recomp-runtime -G Ninja
      - run: cmake --build build/recomp-runtime
      - run: ctest --test-dir build/recomp-runtime --output-on-failure

  runtime-tests-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # Ubuntu 24.04 has no SDL3 package; the build fetches the pinned release.
        # Lavapipe and shaderc run the SDL_GPU presenter test on Vulkan.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mesa-vulkan-drivers libvulkan1 libshaderc1
      - name: Configure public runtime tests
        # The tests use SDL's offscreen driver, so SDL needs no X11 or Wayland.
        run: >-
          cmake -S recomp-runtime -B build/recomp-runtime -G Ninja
          -DRECOMP_FETCH_SDL3=ON -DSDL_UNIX_CONSOLE_BUILD=ON
      - run: cmake --build build/recomp-runtime
      - name: Run public runtime tests
        env:
          SDL_VIDEO_DRIVER: offscreen
          RECOMP_TEST_SOFTWARE_VULKAN: "1"
        run: ctest --test-dir build/recomp-runtime --output-on-failure

  runtime-tests-clang:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned llvm-mingw the way the build does
        working-directory: tools
        run: python -c "from pathlib import Path; import build_prerequisites as p; p.llvm_mingw(Path('..').resolve())"
      - name: Build and run public runtime tests with clang
        shell: pwsh
        run: |
          $env:PATH = "$PWD\tools\llvm-mingw\bin;$env:PATH"
          cmake -S recomp-runtime -B build/clang -G "MinGW Makefiles" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/clang --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/clang --output-on-failure
